// The modules of the build, and for each variant where its classes, sources, resources and
// manifests are, as JSON; nothing is compiled. Groovy, so the Android Gradle plugin is reached
// without its classes on the script's classpath. Two ways in:
//   codemap init: an init script (-I, with `help --no-configuration-cache`), the JSON to -Pcodemap.out;
//   a project's settings.gradle(.kts), `apply from` the copy `codemap wrapper` writes to gradle/: on
//     each configuration the JSON to build/codemap/gradle-model.json, which `codemap build` takes
//     as the model, and after a build that ran a compile task of a variant, `codemapw build --variant`.
import groovy.json.JsonOutput
import javax.inject.Inject
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener
import org.gradle.tooling.events.task.TaskFinishEvent
import org.gradle.tooling.events.task.TaskSuccessResult
import java.util.concurrent.TimeUnit

// After the build, the map of each variant whose classes a task of the build compiled. A failure is
// a warning: the map is a help, it must not fail the build. CODEMAP_SKIP=1 turns it off.
abstract class CodemapRebuild implements BuildService<Params>, OperationCompletionListener, AutoCloseable {
    interface Params extends BuildServiceParameters {
        Property<String> getRoot()
        MapProperty<String, String> getVariants() // compile task -> variant
        Property<String> getModel() // the JSON the configuration wrote, kept in the configuration cache
    }

    private final Set<String> variants = new TreeSet<String>().asSynchronized()

    void onFinish(FinishEvent e) {
        // up to date too: the map may be missing or older than the classes; `build` skips itself
        // in a fraction of a second when it is not
        if (e instanceof TaskFinishEvent && e.result instanceof TaskSuccessResult) {
            def v = parameters.variants.get()[e.descriptor.taskPath]
            if (v != null) {
                variants << v
            }
        }
    }

    void close() {
        def log = org.gradle.api.logging.Logging.getLogger('codemap')
        if (variants.isEmpty() || System.getenv('CODEMAP_SKIP') in ['1', 'true']) {
            return
        }
        def root = new File(parameters.root.get())
        // the model again, always: on a cache hit the configuration did not write it, and the one in
        // codemap.model.json may be of another configuration (a branch checked out and back); `build`
        // takes the newer file with the hash of the build files as they are
        def model = new File(root, 'build/codemap/gradle-model.json')
        model.parentFile.mkdirs()
        model.text = parameters.model.get()
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        def wrapper = new File(root, windows ? 'codemapw.cmd' : 'codemapw')
        def cmd = wrapper.isFile() ? (windows ? ['cmd', '/c', wrapper.path] : [wrapper.path]) : ['codemap']
        for (v in variants) {
            // the output goes to a file: a pipe read to its end would hold the build past the wait below
            def outFile = File.createTempFile('codemap', '.log')
            try {
                def pb = new ProcessBuilder(cmd + ['build', '--variant', v]).directory(root)
                        .redirectErrorStream(true).redirectOutput(outFile)
                pb.environment().put('CODEMAP_HOOK', '1') // codemapw does not retry a download that failed lately
                def p = pb.start()
                // codemapw caps its download, this caps the rest: the build never waits on codemap longer
                if (!p.waitFor(3, TimeUnit.MINUTES)) {
                    p.destroyForcibly()
                    log.warn("codemap: the $v map was not rebuilt: codemap ran over 3 minutes, stopped")
                    continue
                }
                def out = outFile.text.trim()
                if (p.exitValue() == 0) {
                    out.eachLine { if (!it.startsWith('code map is up to date')) log.lifecycle("codemap: $it") }
                } else {
                    log.warn("codemap: the $v map was not rebuilt (exit ${p.exitValue()}):\n$out")
                }
            } catch (IOException err) {
                log.warn("codemap: the $v map was not rebuilt: ${err.message}")
            } finally {
                outFile.delete()
            }
        }
    }
}

// A plugin for the injected registry; listens once the projects are configured, with the compile
// tasks of the model (a provider of them would be read before that: no task would be known).
abstract class CodemapHook implements Plugin<Settings> {
    @Inject
    abstract BuildEventsListenerRegistry getRegistry()

    void apply(Settings settings) {}

    void listen(Gradle gradle, File root, Map<String, String> variants, String model) {
        def service = gradle.sharedServices.registerIfAbsent('codemapRebuild', CodemapRebuild) {
            it.parameters.root.set(root.absolutePath)
            it.parameters.variants.set(variants)
            it.parameters.model.set(model)
        }
        registry.onTaskCompletion(service)
    }
}

// applied by settings: the hook; an init script (the target is Gradle, no settingsDir): -Pcodemap.out
def hook = null
def initOut = null
if (hasProperty('settingsDir')) {
    apply plugin: CodemapHook
    hook = settings.plugins.getPlugin(CodemapHook)
} else if (gradle.parent != null) {
    return // an included build (build-logic): an init script reaches it too, its modules are not the project's
} else {
    initOut = gradle.startParameter.projectProperties['codemap.out']
    if (initOut == null) {
        throw new GradleException('codemap: pass -Pcodemap.out=FILE')
    }
}

def modules = [:].asSynchronized() // Gradle path -> module

def rel = { Project p, File f -> p.rootDir.toPath().relativize(f.toPath()).toString().replace('\\', '/') }

// the directories of a source directory set: AGP 9 has `directories` (strings), older `srcDirs`
def dirsOf = { Project p, ds ->
    ds.hasProperty('directories') ? ds.directories.collect { p.file(it) } : ds.srcDirs as List
}

def capital = { String s -> s ? s[0].toUpperCase() + s.substring(1) : s }

// the source sets of a variant, the general first: main, flavors, flavor combination, build type, variant
def sourceSetNames = { variant ->
    def flavors = variant.productFlavors.collect { it.second }
    def names = ['main'] + flavors
    if (flavors.size() > 1) {
        names << flavors[0] + flavors.drop(1).collect { capital(it) }.join('')
    }
    if (variant.buildType) {
        names << variant.buildType
    }
    names << variant.name
    names.unique()
}

gradle.allprojects { Project p ->
    ['com.android.application': 'application', 'com.android.library': 'library',
     'com.android.dynamic-feature': 'dynamic-feature', 'com.android.test': 'test'].each { id, type ->
        p.plugins.withId(id) {
            def module = [path: p.path, dir: rel(p, p.projectDir), type: type, variants: [:]]
            modules[p.path] = module
            p.androidComponents.onVariants(p.androidComponents.selector().all()) { variant ->
                module.variants[variant.name] = [source_sets: sourceSetNames(variant)]
            }
        }
    }
    p.plugins.withId('java') {
        if (!modules.containsKey(p.path)) {
            modules[p.path] = [path: p.path, dir: rel(p, p.projectDir), type: 'jvm', variants: [main: [source_sets: ['main']]]]
        }
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def variants = new TreeSet<String>()
    modules.values().each { module ->
        def p = root.project(module.path)
        module.variants.each { name, v ->
            variants << name
            def V = capital(name)
            def classes = []
            def tasks = module.type == 'jvm' ? ['compileKotlin', 'compileJava'] :
                    ["compile${V}Kotlin", "compile${V}JavaWithJavac"]
            tasks.each { t ->
                def task = p.tasks.findByName(t)
                if (task != null && task.hasProperty('destinationDirectory')) {
                    classes << rel(p, task.destinationDirectory.get().asFile)
                }
            }
            v.classes = classes
            v.compile_tasks = tasks.findAll { p.tasks.findByName(it) != null }.collect { p.path == ':' ? ":$it" : "$p.path:$it" }
            // the modules the variant's code is compiled against and runs with, as declared (nothing
            // resolved): what an app's compile task compiles too, and what is in the app
            ['compile', 'runtime'].each { kind ->
                def c = p.configurations.findByName(module.type == 'jvm' ? "${kind}Classpath" : "${name}${capital(kind)}Classpath")
                v["${kind}_deps"] = c == null ? [] : c.allDependencies.withType(ProjectDependency).collect {
                    it.hasProperty('path') ? it.path : it.dependencyProject.path // Gradle 8.11 added path
                }.findAll { it != p.path }.unique().sort()
            }
            def sources = [], res = [], manifests = []
            v.source_sets.each { s ->
                def set = module.type == 'jvm' ? p.sourceSets.findByName(s) : p.android.sourceSets.findByName(s)
                if (set == null) {
                    return
                }
                if (module.type == 'jvm') {
                    set.allSource.srcDirs.each { sources << rel(p, it) }
                    set.resources.srcDirs.each { res << rel(p, it) }
                } else {
                    (dirsOf(p, set.kotlin) + dirsOf(p, set.java)).each { sources << rel(p, it) }
                    dirsOf(p, set.res).each { res << rel(p, it) }
                    manifests << rel(p, p.file(set.manifest.srcFile))
                }
            }
            v.sources = sources.unique()
            v.res = res.unique()
            v.manifests = manifests.unique()
        }
    }
    def model = [version: 1,
                 generated: [gradle: gradle.gradleVersion],
                 variants: variants as List,
                 modules: modules.values().sort { it.dir }]
    def text = JsonOutput.prettyPrint(JsonOutput.toJson(model)) + '\n'
    if (hook != null) {
        def tasks = [:]
        modules.values().each { module ->
            module.variants.each { name, v -> v.compile_tasks.each { tasks[it] = name } }
        }
        hook.listen(gradle, root.rootDir, tasks, text)
    }
    // written, never read: a file the configuration reads is an input of the configuration cache
    def out = new File(initOut ?: new File(root.rootDir, 'build/codemap/gradle-model.json').path)
    out.parentFile.mkdirs()
    out.text = text
}
