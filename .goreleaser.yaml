# The release archives (.github/workflows/release.yml); the notes come from CHANGELOG.md.
version: 2
project_name: codemap

builds:
  - main: ./cmd/codemap
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github: # named here, not read from the git remote, so a local check works too
    owner: v-kravchenko
    name: codemap
