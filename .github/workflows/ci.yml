# The checks of AGENTS.md on every push to main and every pull request: tools/check.sh on Linux
# with coverage for Codecov, the tests on macOS and Windows, install.sh on Linux and macOS,
# codemapw on all three.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload by OIDC, no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: tools/check.sh
        env:
          COVERPROFILE: coverage.out
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh install.sh # dash on Ubuntu, the latest release
        env:
          CODEMAP_INSTALL_DIR: ${{ runner.temp }}/bin
      - run: '"$RUNNER_TEMP/bin/codemap" version'

  wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/codemap wrapper --version 0.3.0 --root testdata/navapp
      - if: runner.os != 'Windows'
        run: testdata/navapp/codemapw version | grep -x 'codemap 0.3.0'
      - if: runner.os == 'Windows'
        shell: cmd
        run: testdata\navapp\codemapw.cmd version | findstr /x /c:"codemap 0.3.0"
